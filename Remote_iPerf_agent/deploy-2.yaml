apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf-app
  labels:
    app: iperf-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iperf-app
  template:
    metadata:
      labels:
        app: iperf-app
    spec:
      containers:
      - name: iperf-app
        image: p4lik4ri/iperf-app
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-app-service
  labels:
    app: iperf-app
spec:
  type: NodePort
  selector:
    app: iperf-app
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30002 # You can specify a custom NodePort or leave it to be assigned by Kubernetes
